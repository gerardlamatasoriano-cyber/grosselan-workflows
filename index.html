<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>GrossELAN Time Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #222222;
    --border: #2e2e2e;
    --text: #f0f0f0;
    --text2: #888;
    --text3: #555;
    --green: #4ade80;
    --green-dim: #166534;
    --green-bg: #052e16;
    --amber: #fbbf24;
    --amber-bg: #1c1000;
    --red: #f87171;
    --red-bg: #1c0000;
    --blue: #60a5fa;
    --blue-bg: #0a1628;
    --purple: #a78bfa;
    --accent: #4ade80;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; }

  .app {
    max-width: 420px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding-bottom: 80px;
  }

  header {
    padding: 20px 20px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .logo { font-size: 13px; font-weight: 500; color: var(--text2); letter-spacing: .08em; text-transform: uppercase; }
  .logo span { color: var(--accent); }
  .date-badge { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--text3); }

  .main { flex: 1; padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; }

  .timer-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    transition: border-color .3s;
  }
  .timer-card.running { border-color: var(--green-dim); background: var(--green-bg); }
  .timer-card.paused { border-color: #92400e; background: var(--amber-bg); }

  .status-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text3); }
  .status-dot.running { background: var(--green); animation: pulse 2s infinite; }
  .status-dot.paused { background: var(--amber); animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  .status-text { font-size: 12px; font-weight: 500; color: var(--text2); text-transform: uppercase; letter-spacing: .08em; }
  .status-text.running { color: var(--green); }
  .status-text.paused { color: var(--amber); }

  .timer-display {
    font-family: 'DM Mono', monospace;
    font-size: 48px;
    font-weight: 400;
    color: var(--text);
    letter-spacing: -.02em;
    line-height: 1;
    margin-bottom: 8px;
  }
  .timer-display.running { color: var(--green); }
  .timer-display.paused { color: var(--amber); }

  .timer-meta { font-size: 13px; color: var(--text2); }
  .timer-meta span { color: var(--text); }

  .form-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
  }
  .form-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; font-weight: 500; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .form-grid.full { grid-template-columns: 1fr; }

  select, input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    padding: 10px 12px;
    outline: none;
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
  }
  select:focus, input:focus { border-color: var(--accent); }

  .person-select {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .person-chip {
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface2);
    font-size: 12px;
    color: var(--text2);
    cursor: pointer;
    transition: all .15s;
    white-space: nowrap;
  }
  .person-chip.active {
    border-color: var(--accent);
    background: var(--green-bg);
    color: var(--green);
  }

  .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn-full { grid-column: 1 / -1; }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 16px;
    border-radius: 12px;
    border: none;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: all .15s;
    letter-spacing: -.01em;
  }
  .btn:active { transform: scale(.97); }
  .btn svg { width: 20px; height: 20px; stroke-width: 2; }

  .btn-start { background: var(--green); color: #052e16; }
  .btn-pause { background: var(--amber); color: #1c1000; }
  .btn-resume { background: var(--blue); color: var(--blue-bg); }
  .btn-stop { background: var(--red); color: #1c0000; }
  .btn-new { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-disabled { background: var(--surface2); color: var(--text3); border: 1px solid var(--border); cursor: not-allowed; }

  .entries-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
  }
  .entries-header { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: .08em; font-weight: 500; }
  .entry {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    gap: 10px;
  }
  .entry:last-child { border-bottom: none; }
  .entry-left { flex: 1; min-width: 0; }
  .entry-tag { font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 6px; display: inline-block; margin-bottom: 3px; }
  .tag-montage { background: #052e16; color: var(--green); }
  .tag-fahrzeit { background: #0a1628; color: var(--blue); }
  .tag-buro { background: #1a0a2e; color: var(--purple); }
  .tag-other { background: var(--surface2); color: var(--text2); }
  .entry-project { font-size: 12px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .entry-right { text-align: right; flex-shrink: 0; }
  .entry-time { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--text); }
  .entry-dur { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text2); margin-top: 2px; }
  .entry-dur.active { color: var(--green); }

  .toast {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 16px;
    font-size: 13px; color: var(--text);
    opacity: 0; transition: opacity .3s; pointer-events: none;
    white-space: nowrap; z-index: 100;
  }
  .toast.show { opacity: 1; }
  .toast.success { border-color: var(--green-dim); color: var(--green); }
  .toast.error { border-color: #7f1d1d; color: var(--red); }

  .tab-bar {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 420px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: grid; grid-template-columns: repeat(3, 1fr);
    z-index: 50;
  }
  .tab { padding: 12px 0 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; color: var(--text3); cursor: pointer; }
  .tab.active { color: var(--accent); }
  .tab svg { width: 22px; height: 22px; stroke-width: 1.5; }

  .loading-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.6);
    display: flex; align-items: center; justify-content: center;
    z-index: 200; opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .loading-overlay.show { opacity: 1; pointer-events: all; }
  .spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="logo">Gross<span>ELAN</span> &middot; Time Tracker</div>
    <div class="date-badge" id="header-date"></div>
  </header>

  <div class="main">
    <div class="timer-card" id="timer-card">
      <div class="status-row">
        <div class="status-dot" id="status-dot"></div>
        <div class="status-text" id="status-text">Idle</div>
      </div>
      <div class="timer-display" id="timer-display">00:00:00</div>
      <div class="timer-meta" id="timer-meta">Select a project and check in</div>
    </div>

    <div class="form-card">
      <div class="form-label">Who is clocking in?</div>
      <div class="person-select" id="person-select">
        <div class="person-chip active" data-person="Gerard La Mata" onclick="selectPerson(this)">Gerard</div>
        <div class="person-chip" data-person="Ryszard Pawlik" onclick="selectPerson(this)">Ryszard</div>
        <div class="person-chip" data-person="Dan Chitu" onclick="selectPerson(this)">Dan</div>
        <div class="person-chip" data-person="Mihai Andrei" onclick="selectPerson(this)">Mihai</div>
        <div class="person-chip" data-person="Luftrim Musay" onclick="selectPerson(this)">Luftrim</div>
        <div class="person-chip" data-person="Silviu Oprin" onclick="selectPerson(this)">Silviu</div>
        <div class="person-chip" data-person="Robert Nica" onclick="selectPerson(this)">Robert</div>
        <div class="person-chip" data-person="Tobias Hoppe" onclick="selectPerson(this)">Tobias</div>
        <div class="person-chip" data-person="Razvan Chiaga" onclick="selectPerson(this)">Razvan</div>
      </div>

      <div class="form-label">Project &amp; activity</div>
      <div class="form-grid">
        <select id="project-select">
          <option value="Allgemein 2026">Allgemein 2026</option>
          <option value="AV Albtal BA2">AV Albtal BA2</option>
          <option value="Büro">Büro</option>
          <option value="Elektrotechnische Sanierung RÜB Fischweier">Fischweier RÜB</option>
          <option value="KFP – MSE Filterpresse">KFP – MSE</option>
          <option value="Schwäbisch Hall / HST">Schwäbisch Hall</option>
          <option value="KA Neurod">KA Neurod</option>
          <option value="KA Reutlingen">KA Reutlingen</option>
          <option value="KA Waiblingen">KA Waiblingen</option>
          <option value="KA Steinenbronn">KA Steinenbronn</option>
          <option value="KA Strudelbach">KA Strudelbach</option>
        </select>
        <select id="tag-select">
          <option value="501 Montage">501 Montage</option>
          <option value="900 Fahrzeit">900 Fahrzeit</option>
          <option value="750 Büro">750 Büro</option>
          <option value="104 Baubesprechung – Ing. Büro">104 Baubesprechung</option>
          <option value="101 CAD">101 CAD</option>
          <option value="201 SPS">201 SPS</option>
          <option value="301 PLS">301 PLS</option>
          <option value="401 Werkstatt">401 Werkstatt</option>
          <option value="601 Rapport">601 Rapport</option>
          <option value="701 Urlaub">701 Urlaub</option>
          <option value="702 Krankheit">702 Krankheit</option>
          <option value="703 Zeitausgleich">703 Zeitausgleich</option>
        </select>
      </div>

      <div class="btn-grid" id="btn-grid">
        <button class="btn btn-start btn-full" onclick="doCheckin()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><polygon points="10,8 16,12 10,16"/></svg>
          Check in
        </button>
      </div>
    </div>

    <div class="entries-card">
      <div class="entries-header">Today's entries</div>
      <div id="entries-list">
        <div class="entry" style="justify-content:center;padding:20px">
          <span style="font-size:13px;color:var(--text3)">No entries yet today</span>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="tab-bar">
  <div class="tab active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><polyline points="12,6 12,12 16,14"/></svg>
    Clock
  </div>
  <div class="tab">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    History
  </div>
  <div class="tab">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
    Summary
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="loading-overlay" id="loading"><div class="spinner"></div></div>

<script>
const WEBHOOKS = {
  checkin:  'https://primary-production-96473.up.railway.app/webhook/checkin',
  pause:    'https://primary-production-96473.up.railway.app/webhook/pause',
  resume:   'https://primary-production-96473.up.railway.app/webhook/resume',
  checkout: 'https://primary-production-96473.up.railway.app/webhook/checkout'
};

let state = 'idle';
let currentPerson = 'Gerard La Mata';
let timerStart = null;
let pauseStart = null;
let totalPausedMs = 0;
let timerInterval = null;
let entries = [];

function selectPerson(el) {
  document.querySelectorAll('.person-chip').forEach(function(c) { c.classList.remove('active'); });
  el.classList.add('active');
  currentPerson = el.dataset.person;
}

function now() { return new Date().toISOString(); }
function pad(n) { return String(Math.floor(n)).padStart(2, '0'); }
function formatElapsed(ms) {
  var s = Math.floor(ms / 1000);
  return pad(s / 3600) + ':' + pad((s % 3600) / 60) + ':' + pad(s % 60);
}
function formatTime(iso) {
  var d = new Date(iso);
  return pad(d.getHours()) + ':' + pad(d.getMinutes());
}

function updateTimer() {
  if (state === 'idle') return;
  var nowMs = Date.now();
  if (state === 'running') {
    var elapsed = nowMs - timerStart - totalPausedMs;
    document.getElementById('timer-display').textContent = formatElapsed(Math.max(0, elapsed));
  } else if (state === 'paused') {
    // FIX 1: Timer counts UP showing how long the current pause has lasted (orange, not frozen)
    var pauseElapsed = nowMs - pauseStart;
    document.getElementById('timer-display').textContent = formatElapsed(Math.max(0, pauseElapsed));
    // Keep meta updated with work accumulated before this pause
    var workMs = pauseStart - timerStart - totalPausedMs;
    var proj = document.getElementById('project-select').value;
    var tag  = document.getElementById('tag-select').value;
    document.getElementById('timer-meta').innerHTML =
      '<span>' + proj + '</span> &middot; ' + tag + ' &middot; work so far: ' + formatElapsed(Math.max(0, workMs));
  }
}

function setUIState(s) {
  state = s;
  var card = document.getElementById('timer-card');
  var dot  = document.getElementById('status-dot');
  var txt  = document.getElementById('status-text');
  var disp = document.getElementById('timer-display');
  var meta = document.getElementById('timer-meta');
  var grid = document.getElementById('btn-grid');
  var proj = document.getElementById('project-select').value;
  var tag  = document.getElementById('tag-select').value;

  card.className = 'timer-card ' + (s !== 'idle' ? s : '');
  dot.className  = 'status-dot '  + (s !== 'idle' ? s : '');
  disp.className = 'timer-display ' + (s !== 'idle' ? s : '');

  clearInterval(timerInterval);

  if (s === 'idle') {
    txt.textContent = 'Idle'; txt.className = 'status-text';
    disp.textContent = '00:00:00';
    meta.textContent = 'Select a project and check in';
    grid.innerHTML = '<button class="btn btn-start btn-full" onclick="doCheckin()">'
      + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><polygon points="10,8 16,12 10,16"/></svg>'
      + 'Check in</button>';

  } else if (s === 'running') {
    txt.textContent = 'Running'; txt.className = 'status-text running';
    meta.innerHTML = '<span>' + proj + '</span> &middot; ' + tag + ' &middot; since ' + formatTime(new Date(timerStart).toISOString());
    grid.innerHTML =
      '<button class="btn btn-pause" onclick="doPause()">'
      + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>'
      + 'Pause</button>'
      + '<button class="btn btn-stop" onclick="doCheckout()">'
      + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>'
      + 'Check out</button>'
      + '<button class="btn btn-new btn-full" onclick="doNewEntry()">'
      + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>'
      + 'New entry (change project/tag)</button>';
    timerInterval = setInterval(updateTimer, 1000);

  } else if (s === 'paused') {
    txt.textContent = 'Paused'; txt.className = 'status-text paused';
    var workMs = pauseStart - timerStart - totalPausedMs;
    meta.innerHTML = '<span>' + proj + '</span> &middot; ' + tag + ' &middot; work so far: ' + formatElapsed(Math.max(0, workMs));
    disp.textContent = '00:00:00';
    grid.innerHTML =
      '<button class="btn btn-resume" onclick="doResume()">'
      + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><polygon points="10,8 16,12 10,16"/></svg>'
      + 'Resume</button>'
      + '<button class="btn btn-stop" onclick="doCheckout()">'
      + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>'
      + 'Check out</button>';
    // FIX 1: Keep interval running so pause duration counts up in orange
    timerInterval = setInterval(updateTimer, 1000);
  }
}

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (type || '');
  setTimeout(function() { t.className = 'toast'; }, 3000);
}

function loading(show) {
  document.getElementById('loading').className = 'loading-overlay' + (show ? ' show' : '');
}

// FIX 3: callWebhook now returns {ok, status, data} instead of a plain boolean
async function callWebhook(action, extra) {
  var payload = Object.assign({
    person:    currentPerson,
    project:   document.getElementById('project-select').value,
    tag:       document.getElementById('tag-select').value,
    timestamp: now()
  }, extra || {});
  try {
    var r = await fetch(WEBHOOKS[action], {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    var data = await r.json().catch(function() { return {}; });
    return { ok: r.ok, status: r.status, data: data };
  } catch(e) {
    return { ok: false, status: 0, data: {} };
  }
}

function addEntry(project, tag, startTime) {
  entries.push({ project: project, tag: tag, startTime: startTime, endTime: null, status: 'active', breakMs: 0, id: Date.now() });
  renderEntries();
}

// FIX 2: renderEntries shows accumulated break time on entries with pauses
function renderEntries() {
  var list = document.getElementById('entries-list');
  if (!entries.length) {
    list.innerHTML = '<div class="entry" style="justify-content:center;padding:20px"><span style="font-size:13px;color:var(--text3)">No entries yet today</span></div>';
    return;
  }
  list.innerHTML = entries.slice().reverse().map(function(e) {
    var tagClass = e.tag.includes('501') ? 'tag-montage'
      : e.tag.includes('900') ? 'tag-fahrzeit'
      : e.tag.includes('750') ? 'tag-buro'
      : 'tag-other';

    var durStr = '';
    if (e.status === 'active') {
      var elapsed = Date.now() - new Date(e.startTime).getTime() - (e.breakMs || 0);
      durStr = '<span class="entry-dur active">' + formatElapsed(Math.max(0, elapsed)) + ' &#9654;</span>';
    } else if (e.endTime) {
      var netMs = new Date(e.endTime) - new Date(e.startTime) - (e.breakMs || 0);
      var inner = formatElapsed(Math.max(0, netMs));
      if (e.breakMs > 0) {
        inner += ' <span style="color:var(--amber);font-size:10px">&#9646; ' + formatElapsed(e.breakMs) + '</span>';
      }
      durStr = '<span class="entry-dur">' + inner + '</span>';
    }

    return '<div class="entry">'
      + '<div class="entry-left">'
      + '<span class="entry-tag ' + tagClass + '">' + e.tag.split(' ').slice(0,2).join(' ') + '</span>'
      + '<div class="entry-project">' + e.project + '</div>'
      + '</div>'
      + '<div class="entry-right">'
      + '<div class="entry-time">' + formatTime(e.startTime) + (e.endTime ? ' &ndash; ' + formatTime(e.endTime) : ' &ndash; now') + '</div>'
      + durStr
      + '</div>'
      + '</div>';
  }).join('');
}

async function doCheckin() {
  loading(true);
  var res = await callWebhook('checkin');
  loading(false);
  if (res.ok) {
    timerStart = Date.now();
    totalPausedMs = 0;
    addEntry(
      document.getElementById('project-select').value,
      document.getElementById('tag-select').value,
      new Date().toISOString()
    );
    setUIState('running');
    showToast('Checked in', 'success');
  } else if (res.status === 409) {
    // FIX 3: Show 409 error message from the backend instead of failing silently
    showToast(res.data.error || 'Ya hay una entrada activa para esta persona', 'error');
  } else {
    showToast('Connection error — check your network', 'error');
  }
}

async function doPause() {
  loading(true);
  var res = await callWebhook('pause');
  loading(false);
  if (res.ok) {
    pauseStart = Date.now();
    var entry = entries[entries.length - 1];
    if (entry) entry.status = 'paused';
    renderEntries();
    setUIState('paused');
    showToast('Paused', 'success');
  } else {
    showToast('Connection error', 'error');
  }
}

async function doResume() {
  loading(true);
  var res = await callWebhook('resume');
  loading(false);
  if (res.ok) {
    var pauseDuration = Date.now() - pauseStart;
    totalPausedMs += pauseDuration;
    // FIX 2: Update existing entry (accumulate break) — don't create a new entry
    var entry = entries[entries.length - 1];
    if (entry) {
      entry.breakMs = (entry.breakMs || 0) + pauseDuration;
      entry.status = 'active';
    }
    renderEntries();
    setUIState('running');
    showToast('Resumed', 'success');
  } else {
    showToast('Connection error', 'error');
  }
}

async function doCheckout() {
  loading(true);
  var res = await callWebhook('checkout');
  loading(false);
  if (res.ok) {
    var entry = entries[entries.length - 1];
    if (entry) { entry.endTime = new Date().toISOString(); entry.status = 'done'; }
    renderEntries();
    setUIState('idle');
    showToast('Checked out', 'success');
  } else {
    showToast('Connection error', 'error');
  }
}

async function doNewEntry() {
  loading(true);
  var res = await callWebhook('checkout');
  loading(false);
  if (res.ok) {
    var entry = entries[entries.length - 1];
    if (entry) { entry.endTime = new Date().toISOString(); entry.status = 'done'; }
    setTimeout(async function() {
      loading(true);
      var res2 = await callWebhook('checkin');
      loading(false);
      if (res2.ok) {
        timerStart = Date.now();
        totalPausedMs = 0;
        addEntry(
          document.getElementById('project-select').value,
          document.getElementById('tag-select').value,
          new Date().toISOString()
        );
        setUIState('running');
        showToast('New entry started', 'success');
      } else if (res2.status === 409) {
        showToast(res2.data.error || 'Ya hay una entrada activa', 'error');
      } else {
        showToast('Connection error', 'error');
      }
    }, 500);
  } else {
    showToast('Connection error', 'error');
  }
}

function updateHeaderDate() {
  var d = new Date();
  var days   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('header-date').textContent =
    days[d.getDay()] + ' ' + d.getDate() + ' ' + months[d.getMonth()];
}

updateHeaderDate();
setInterval(renderEntries, 10000);
</script>
